<svg xmlns="http://www.w3.org/2000/svg"     viewBox="0 0 1200 800"
	 width="100%"
	 height="100%"
	 preserveAspectRatio="none"
>
	<defs>
		<!-- Левый градиент: растворяется слева направо -->
		<linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#007bff" stop-opacity="0.8" />
			<stop offset="100%" stop-color="#00c6ff" stop-opacity="0.1" />
		</linearGradient>

		<!-- Правый градиент: растворяется справа налево -->
		<linearGradient id="rightGrad" x1="100%" y1="0%" x2="0%" y2="0%">
			<stop offset="0%" stop-color="#007bff" stop-opacity="0.8" />
			<stop offset="100%" stop-color="#00c6ff" stop-opacity="0.1" />
		</linearGradient>
	</defs>

	<!-- ЛЕВАЯ ВОЛНА -->
	<path
			d="M 0,0
       L 300,0
       C 400,250 200,550 350,800
       L 0,800
       Z"
			fill="url(#leftGrad)"
	/>

	<!-- ПРАВАЯ ВОЛНА -->
	<path
			d="M 1200,0
       L 900,0
       C 800,250 1000,550 850,800
       L 1200,800
       Z"
			fill="url(#rightGrad)"
	/>
</svg>